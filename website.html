<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nike</title>
  <link rel="icon" type ="image/x-icon" href="nike.jpg">
</head>
</head>
<body>
  <a class="link" href="https://www.nike.com" target = "_blank">
    Back to Nike stores
  </a>

<p class="Nike-product">
  Nike Black Running Shoes
</p>

<p class="Product-price">
  Price: $120 - in stock.
</p>

<p class ="Exclamation">
  Free delivery tomorrow if you order in the next 3 hours!!
</p>

<button class="Add-to-cart">
  Add to cart
</button>

<button class ="Buy-now">

</button>


<style>

    font-size: 24px;
    font-weight: bold;

  }

  .Product-price{
    font-size: 17px;
    color: green;
    font-weight:bold
  }

  .Exclamation{

  }

  .Add-to-cart{
    background: rgb(255,216,20); 
    border :none;
    border-width: 1px;
    height:36px;
		width: 100px;
		border-radius:18px;
    margin-right: 8px;
    cursor: pointer;
    font-weight: bold;
    font-style: italic;
  }
  .Buy-now{
    background: rgb(255, 164, 28); 
    border :none;
    border-width: 1px;
    height:36px;
		width: 100px;
		border-radius:18px;
    margin-right: 8px;
    cursor: pointer;
    font-weight: bold;
    font-style: italic;
  }

  .link{
    color: rgb(0,113,133);
  }
